swagger: "2.0"
info:
  title: Content Generator API
  description: API for AI content generation
  version: 1.0.0
schemes:
  - https
produces:
  - application/json
paths:
  /generate:
    post:
      summary: Generate AI content
      operationId: generateContent
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
            properties:
              prompt:
                type: string
              contentType:
                type: string
                enum: [blog, social, email, ad]
      responses:
        200:
          description: Success
          schema:
            type: object
            properties:
              content:
                type: string