name: Terraform CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'infrastructure/**'

jobs:
  terraform:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.5.0

    - name: Terraform Init
      run: cd infrastructure && terraform init

    - name: Terraform Validate
      run: cd infrastructure && terraform validate

    - name: Terraform Plan
      run: cd infrastructure && terraform plan -var="gcp_project_id=ai-content-generator-478607" -var="region=us-central1"

    - name: Terraform Apply
      run: cd infrastructure && terraform apply -auto-approve -var="gcp_project_id=ai-content-generator-478607" -var="region=us-central1"
      env:
        GOOGLE_CREDENTIALS: ${{ secrets.GCP_SA_KEY }}